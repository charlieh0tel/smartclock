name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # The shared definition, so this repo's CI matches the others.
    #
    #   fmt-toolchain  empty, not nightly.  rust-toolchain.toml pins the
    #                  compiler and the workflow now reads the channel out
    #                  of it, so the version no longer lives in two places;
    #                  emptying this makes the fmt job resolve the same way
    #                  instead of fetching a nightly for rustfmt alone.
    #   audit          off here, not because auditing does not matter, but
    #                  because audit.yml already does it on the schedule a
    #                  called workflow cannot have -- see the note there.
    #   check-args     --all-targets, or clippy never sees the tests,
    #                  which are the larger half of this workspace
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-ci.yml@v1
    with:
      # serialport needs libudev on Linux.
      build-deps: "libudev-dev"
      fmt-toolchain: ""
      audit: false
      check-args: "--workspace --all-targets --all-features"

  no-std:
    # smartclock-gps and smartclock-gps-ublox are no_std and do not
    # allocate, so that one copy runs on a microcontroller, in a browser
    # and on a host.  The jobs above build them for a host, which proves
    # neither of the other two; this builds them for targets of each.
    # `make check-no-std`.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The pin audit.yml carries; moved by hand to match it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The compiler rust-toolchain.toml names, installed here rather
      # than on the first cargo call because the targets are added to
      # it: `rustup target add` of the Makefile's NO_STD_TARGETS, so the
      # list is in one place.
      - run: rustup toolchain install
      - run: make no-std-targets
      - run: make check-no-std

  doc:
    # The API documentation builds without a rustdoc warning: `make doc`
    # makes one an error.  A job here because the shared workflow has
    # none for it.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The pin audit.yml carries; moved by hand to match it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # serialport needs libudev.  The compiler is the one
      # rust-toolchain.toml names, which rustup installs on the first
      # cargo call.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # The pin rust-ci.yml carries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make doc

  prototype-58501a:
    # The figures docs/firmware/58501a.md quotes: `make
    # check-58501a-figures`.  A job of its own, apart from firmware.yml,
    # which builds no Rust, because it builds smartclock-cli for
    # dump-pforth; and it decodes the FPGA pins in node (web.yml's pin),
    # with the viewer the target clones at its pinned commit, and reads
    # the images with tools/firmware/figures_58501a.py, whose Capstone
    # `uv run` installs from the script's inline metadata.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The pin audit.yml carries; moved by hand to match it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # serialport needs libudev.  The compiler is the one
      # rust-toolchain.toml names, which rustup installs on the first
      # cargo call.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # The pin rust-ci.yml carries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # firmware.yml's pin.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.2"
          enable-cache: true
          cache-dependency-glob: "tools/firmware/figures_58501a.py"
      - run: node --version && uv --version
      - run: make check-58501a-figures

  attribution:
    # No commit credits an AI assistant (AGENTS.md).  The check the
    # commit-msg hook makes, over the whole history, for a commit made
    # in a clone without the hook.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git log --format=%B HEAD | sh .githooks/commit-msg /dev/stdin
