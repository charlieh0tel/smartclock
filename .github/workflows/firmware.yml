name: firmware

# The Z3805A 3543B, 58503A 3704 and Z3801A 3543 firmware's checks
# (docs/firmware/README.md, "The checks in CI"): the C's format, the
# layouts, the decompiled C's bytes and bindings, every decompiled
# function run against the image's own and the figures the documents
# give, the SCPI trees, the module and pForth figures, the 58503A's and
# Z3801A's diffs against the Z3805A and the names seeded from them, every image's
# chip-select tables, the hand-written C's magic numbers, the addresses
# the 58503A's and Z3801A's C's comments cite, and the shared C.
#
# Separate from ci.yml because that one is the shared definition every
# repository in the fleet calls, and this needs an m68k toolchain,
# clang, clang-format and uv the others do not; and so that it fails
# on its own.  No Rust: none of these targets builds the workspace.  About
# ten minutes, most of it report-decompiled's two images.
#
# On every push, not main's alone, so a firmware branch's own pushes
# are checked too.
on:
  push:
  pull_request:

jobs:
  checks:
    # 26.04, not latest (24.04), for gcc 15, the one the C is developed
    # with; 24.04's gcc 13 gives the same figures (docs/firmware/README.md,
    # "The checks in CI").  A preview image as of 2026-10.
    runs-on: ubuntu-26.04
    # Three images' function checks take some 28 minutes.
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      # The image the checks run for, but those naming another; the
      # 58503A's and Z3801A's run as steps of their own.
      IMAGE: z3805a-3543b
      # Named, so that a newer default cannot change the format: 19, 20
      # and 21 format the C alike, and 18 three of the files otherwise.
      CLANG_FORMAT: clang-format-21
      # check-magic-numbers parses the hand-written C with it.
      CLANG: clang-21
    steps:
      # The pin audit.yml carries; moved by hand to match it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          gcc-m68k-linux-gnu binutils-m68k-linux-gnu "$CLANG_FORMAT" "$CLANG"
      # The tools' script dependencies, Unicorn and Capstone, are each
      # script's own inline metadata, pinned there, which `uv run`
      # resolves; uv itself is pinned here, and the cache is keyed on
      # the scripts.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.2"
          enable-cache: true
          cache-dependency-glob: "tools/firmware/*.py"
      - run: >-
          m68k-linux-gnu-gcc --version && "$CLANG_FORMAT" --version && "$CLANG" --version
          && python3 --version && uv --version
      # Each check runs whatever the one before it did, so that one run
      # names every failing check.
      - run: make check-format-c
        if: ${{ !cancelled() }}
      - run: make check-types
        if: ${{ !cancelled() }}
      - run: make check-types IMAGE=58503a-3704
        if: ${{ !cancelled() }}
      - run: make check-types IMAGE=z3801a-3543
        if: ${{ !cancelled() }}
      - run: make check-module-figures
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree IMAGE=58503a-3704
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree IMAGE=z3801a-3543
        if: ${{ !cancelled() }}
      - run: make check-pforth-words
        if: ${{ !cancelled() }}
      - run: make check-image-diff
        if: ${{ !cancelled() }}
      - run: make check-chip-selects
        if: ${{ !cancelled() }}
      - run: make check-loop-trace
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers IMAGE=58503a-3704
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers IMAGE=z3801a-3543
        if: ${{ !cancelled() }}
      - run: make check-comment-addresses
        if: ${{ !cancelled() }}
      - run: make check-common
        if: ${{ !cancelled() }}
      - run: make check-decompiled
        if: ${{ !cancelled() }}
      - run: make check-decompiled IMAGE=58503a-3704
        if: ${{ !cancelled() }}
      - run: make check-decompiled IMAGE=z3801a-3543
        if: ${{ !cancelled() }}
      # Without IMAGE, for every image: fails on a failed function, and
      # checks the documents' figures from each image's function check
      # against its report.
      - run: make report-decompiled IMAGE=
        if: ${{ !cancelled() }}
