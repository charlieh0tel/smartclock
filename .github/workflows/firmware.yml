name: firmware

# The Z3805A 3543B, 58503A 3704, Z3801A 3543, Z3815A 4010, Z3817A
# 3752, Z3816A 4001, 58503B 1.01.04 and Z3805A 1.01.03 firmware's
# checks (docs/firmware/README.md, "The checks in CI"): the C's format,
# the layouts, the decompiled C's bytes and bindings, each hand-written
# file compiled alone, each image's link from its hand-written C and
# assembly alone, every function required, every decompiled function
# run against the image's own and the figures the documents give, the
# SCPI trees, the module and pForth figures, the 58503A's, Z3801A's,
# Z3815A's, Z3817A's, Z3816A's, 58503B's and Z3805A 1.01.03's diffs and
# the names seeded
# from them, every image's
# chip-select tables, the hand-written C's magic numbers and ROM
# pointers, the addresses the 58503A's and Z3801A's C's comments cite,
# and the shared C; the
# board atlas and the block diagram built from their data, every
# citation in them checked; the
# FPGA decoder against XACT's test designs; and the FPGA netlists' fast
# path against their references, and the explainer and detail pages
# built.
#
# Separate from ci.yml because that one is the shared definition every
# repository in the fleet calls, and this needs an m68k toolchain,
# clang, clang-format and uv the others do not; and so that it fails
# on its own.  No Rust: none of these targets builds the workspace.  Most
# of a run is report-decompiled's, the eight images' function checks, a
# job each beside the rest; checks, the required check, passes if they
# all do.
#
# On pull requests and pushes to main, not on a branch's own pushes,
# which its pull request's run checks: both ran each change twice at
# once.  A branch without a pull request runs it by hand
# (workflow_dispatch).  On a pull request, report-decompiled runs only
# where anything it reads changed against its base
# (tools/ci/report-decompiled-needed); on a push to main and when run by
# hand it always runs, main's full run the backstop for an input
# missing from the script's list.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The images report-decompiled runs for, the firmware Makefile's
  # REPORTED_IMAGES, and on a pull request whether it runs.
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      images: ${{ steps.images.outputs.images }}
      run: ${{ steps.report-decompiled.outputs.run }}
    steps:
      # The pin audit.yml carries; moved by hand to match it.
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The history, for the pull request's base report-decompiled's
        # guard compares against (tools/ci/report-decompiled-needed).
        with:
          fetch-depth: 0
      - id: images
        run: echo "images=$(make -s reported-images)" >> "$GITHUB_OUTPUT"
      # Whether report-decompiled needs to run: whether anything it reads
      # changed (tools/ci/report-decompiled-needed) against a pull
      # request's base.  A push to main or a run by hand runs it in full.
      - id: report-decompiled
        env:
          PULL_BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          if [ "$GITHUB_EVENT_NAME" = pull_request ];
          then tools/ci/report-decompiled-needed "$PULL_BASE";
          else echo run=true >> "$GITHUB_OUTPUT"; fi

  other-checks:
    # 26.04, not latest (24.04), for gcc 15, the one the C is developed
    # with; 24.04's gcc 13 gives the same figures (docs/firmware/README.md,
    # "The checks in CI").  A preview image as of 2026-10.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # The image the checks run for, but those naming another; the
      # 58503A's and Z3801A's run as steps of their own.
      IMAGE: z3805a-3543b
      # Named, so that a newer default cannot change the format: 19, 20
      # and 21 format the C alike, and 18 three of the files otherwise.
      CLANG_FORMAT: clang-format-21
      # check-magic-numbers parses the hand-written C with it.
      CLANG: clang-21
    steps:
      - *checkout
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          gcc-m68k-linux-gnu binutils-m68k-linux-gnu "$CLANG_FORMAT" "$CLANG"
          iverilog yosys poppler-utils
      # The tools' script dependencies, mc683xx and Capstone, are each
      # script's own inline metadata, pinned there, which `uv run`
      # resolves; uv itself is pinned here, and the cache is keyed on
      # the scripts.
      - &setup-uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.2"
          enable-cache: true
          cache-dependency-glob: "tools/firmware/*.py"
      - run: >-
          m68k-linux-gnu-gcc --version && "$CLANG_FORMAT" --version && "$CLANG" --version
          && python3 --version && uv --version && iverilog -V | head -n 1 && yosys -V
          && pdftotext -v && nproc
      # Each check runs whatever the one before it did, so that one run
      # names every failing check.
      - run: make check-format-c
        if: ${{ !cancelled() }}
      - run: make check-types
        if: ${{ !cancelled() }}
      - run: make check-types IMAGE=58503a-3704
        if: ${{ !cancelled() }}
      - run: make check-types IMAGE=z3801a-3543
        if: ${{ !cancelled() }}
      - run: make check-module-figures
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree IMAGE=58503a-3704
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree IMAGE=z3801a-3543
        if: ${{ !cancelled() }}
      - run: make check-pforth-words
        if: ${{ !cancelled() }}
      - run: make check-image-diff
        if: ${{ !cancelled() }}
      - run: make check-status-register
        if: ${{ !cancelled() }}
      - run: make check-chip-selects
        if: ${{ !cancelled() }}
      - run: make board-atlas
        if: ${{ !cancelled() }}
      - run: make block-diagram
        if: ${{ !cancelled() }}
      - run: make coverage
        if: ${{ !cancelled() }}
      - run: make check-loop-trace
        if: ${{ !cancelled() }}
      - run: make check-softfloat
        if: ${{ !cancelled() }}
      - run: make check-loop-constants
        if: ${{ !cancelled() }}
      - run: make check-loop-gain
        if: ${{ !cancelled() }}
      - run: make check-gps-fields
        if: ${{ !cancelled() }}
      # The FPGA decoder against XACT's test designs, in node (web.yml's
      # pin), with the viewer cloned at a pinned commit.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: 22
      - run: node --version && make check-fpga-decoder
        if: ${{ !cancelled() }}
      # Each FPGA image's decode, netlist, structure and fast simulation
      # against tools/fpga/ref, and the explainer and detail pages built
      # (docs/firmware/fpga-comparison.md, "Reproduce"); the long runs,
      # check-readings, are not CI's.
      - run: make -f tools/fpga/Makefile check
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers IMAGE=58503a-3704
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers IMAGE=z3801a-3543
        if: ${{ !cancelled() }}
      - run: make check-comment-addresses
        if: ${{ !cancelled() }}
      # Without IMAGE, for every image with an export: each one's ROM
      # pointers, the tool's self-test first.
      - run: make check-rom-pointers IMAGE=
        if: ${{ !cancelled() }}
      - run: make check-common
        if: ${{ !cancelled() }}
      - run: make check-plain-names
        if: ${{ !cancelled() }}
      # Without IMAGE, for every image with an export: each hand-written
      # .c compiled alone after the export's declarations and headers.
      - run: make check-alone IMAGE=
        if: ${{ !cancelled() }}
      - run: make check-decompiled
        if: ${{ !cancelled() }}
      - run: make check-decompiled IMAGE=58503a-3704
        if: ${{ !cancelled() }}
      - run: make check-decompiled IMAGE=z3801a-3543
        if: ${{ !cancelled() }}
      # The Z3815A 4010's export; its link and function checks run with
      # the other reported images', below.
      - run: make check-types IMAGE=z3815a-4010
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree IMAGE=z3815a-4010
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers IMAGE=z3815a-4010
        if: ${{ !cancelled() }}
      - run: make check-decompiled IMAGE=z3815a-4010
        if: ${{ !cancelled() }}
      # The Z3817A 3752's export, likewise.
      - run: make check-types IMAGE=z3817a-3752
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree IMAGE=z3817a-3752
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers IMAGE=z3817a-3752
        if: ${{ !cancelled() }}
      - run: make check-decompiled IMAGE=z3817a-3752
        if: ${{ !cancelled() }}
      # The Z3816A 4001's export, likewise.
      - run: make check-types IMAGE=z3816a-4001
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree IMAGE=z3816a-4001
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers IMAGE=z3816a-4001
        if: ${{ !cancelled() }}
      - run: make check-decompiled IMAGE=z3816a-4001
        if: ${{ !cancelled() }}
      # The 58503B 1.01.04's export, likewise.
      - run: make check-types IMAGE=58503b-1.01.04
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree IMAGE=58503b-1.01.04
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers IMAGE=58503b-1.01.04
        if: ${{ !cancelled() }}
      - run: make check-decompiled IMAGE=58503b-1.01.04
        if: ${{ !cancelled() }}
      # The Z3805A 1.01.03's export, likewise.
      - run: make check-types IMAGE=z3805a-1.01.03
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree IMAGE=z3805a-1.01.03
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers IMAGE=z3805a-1.01.03
        if: ${{ !cancelled() }}
      - run: make check-decompiled IMAGE=z3805a-1.01.03
        if: ${{ !cancelled() }}
      # Without IMAGE, for every reported image: fails if one does not link
      # from its hand-written C and assembly alone, every function
      # required.  -j, so that the images run at once, each one's output
      # printed whole.
      - run: make -j"$(nproc)" check-link IMAGE=
        if: ${{ !cancelled() }}

  # Each image's function check, on mc683xx's CPU32 (the Makefile's
  # CPU), after its link check: fails on a failed function, and checks
  # the documents' figures from the function check against its report.
  # Skipped where plan found nothing it reads changed.
  report-decompiled:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - *checkout
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          gcc-m68k-linux-gnu binutils-m68k-linux-gnu
      - *setup-uv
      - run: m68k-linux-gnu-gcc --version && python3 --version && uv --version && nproc
      - env:
          IMAGE: ${{ matrix.image }}
        run: make report-decompiled IMAGE="$IMAGE"

  # The required check: fails unless plan and other-checks passed and
  # each image's report-decompiled passed or, plan finding nothing it
  # reads changed, was skipped.  always(), so that a failed or cancelled
  # job before it is a failure here, never a skip.
  checks:
    needs: [plan, other-checks, report-decompiled]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          OTHER_CHECKS: ${{ needs.other-checks.result }}
          REPORT_DECOMPILED: ${{ needs.report-decompiled.result }}
          RUN: ${{ needs.plan.outputs.run }}
        run: >-
          echo "plan: $PLAN, other-checks: $OTHER_CHECKS, report-decompiled: $REPORT_DECOMPILED, run: $RUN"
          && [ "$PLAN" = success ] && [ "$OTHER_CHECKS" = success ]
          && { [ "$REPORT_DECOMPILED" = success ] || { [ "$REPORT_DECOMPILED" = skipped ] && [ "$RUN" = false ]; }; }
