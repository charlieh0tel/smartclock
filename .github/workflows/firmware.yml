name: firmware

# The Z3805A 3543B, 58503A 3704, Z3801A 3543 and Z3815A 4010 firmware's
# checks (docs/firmware/README.md, "The checks in CI"): the C's format,
# the layouts, the decompiled C's bytes and bindings, each hand-written
# file compiled alone, each image's link from its hand-written C and
# assembly alone, every function required, every decompiled function
# run against the image's own and the figures the documents give, the
# SCPI trees, the module and pForth figures, the 58503A's, Z3801A's and
# Z3815A's diffs and the names seeded from them, every image's
# chip-select tables, the hand-written C's magic numbers, the addresses
# the 58503A's and Z3801A's C's comments cite, and the shared C; the
# board atlas and the block diagram built from their data, every
# citation in them checked; the
# FPGA decoder against XACT's test designs; and the FPGA netlists' fast
# path against their references, and the explainer page built.
#
# Separate from ci.yml because that one is the shared definition every
# repository in the fleet calls, and this needs an m68k toolchain,
# clang, clang-format and uv the others do not; and so that it fails
# on its own.  No Rust: none of these targets builds the workspace.  Most
# of a run is report-decompiled's.
#
# On every push, not main's alone, so a firmware branch's own pushes
# are checked too.
on:
  push:
  pull_request:

jobs:
  checks:
    # 26.04, not latest (24.04), for gcc 15, the one the C is developed
    # with; 24.04's gcc 13 gives the same figures (docs/firmware/README.md,
    # "The checks in CI").  A preview image as of 2026-10.
    runs-on: ubuntu-26.04
    # The four images' function checks, each case run again poisoned,
    # took past 50 minutes on 2026-11-05.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # The image the checks run for, but those naming another; the
      # 58503A's and Z3801A's run as steps of their own.
      IMAGE: z3805a-3543b
      # Named, so that a newer default cannot change the format: 19, 20
      # and 21 format the C alike, and 18 three of the files otherwise.
      CLANG_FORMAT: clang-format-21
      # check-magic-numbers parses the hand-written C with it.
      CLANG: clang-21
    steps:
      # The pin audit.yml carries; moved by hand to match it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          gcc-m68k-linux-gnu binutils-m68k-linux-gnu "$CLANG_FORMAT" "$CLANG"
          iverilog yosys poppler-utils
      # The tools' script dependencies, Unicorn, mc683xx and Capstone, are each
      # script's own inline metadata, pinned there, which `uv run`
      # resolves; uv itself is pinned here, and the cache is keyed on
      # the scripts.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.2"
          enable-cache: true
          cache-dependency-glob: "tools/firmware/*.py"
      - run: >-
          m68k-linux-gnu-gcc --version && "$CLANG_FORMAT" --version && "$CLANG" --version
          && python3 --version && uv --version && iverilog -V | head -n 1 && yosys -V
          && pdftotext -v
      # Each check runs whatever the one before it did, so that one run
      # names every failing check.
      - run: make check-format-c
        if: ${{ !cancelled() }}
      - run: make check-types
        if: ${{ !cancelled() }}
      - run: make check-types IMAGE=58503a-3704
        if: ${{ !cancelled() }}
      - run: make check-types IMAGE=z3801a-3543
        if: ${{ !cancelled() }}
      - run: make check-module-figures
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree IMAGE=58503a-3704
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree IMAGE=z3801a-3543
        if: ${{ !cancelled() }}
      - run: make check-pforth-words
        if: ${{ !cancelled() }}
      - run: make check-image-diff
        if: ${{ !cancelled() }}
      - run: make check-chip-selects
        if: ${{ !cancelled() }}
      - run: make board-atlas
        if: ${{ !cancelled() }}
      - run: make block-diagram
        if: ${{ !cancelled() }}
      - run: make check-loop-trace
        if: ${{ !cancelled() }}
      # The FPGA decoder against XACT's test designs, in node (web.yml's
      # pin), with the viewer cloned at a pinned commit.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: 22
      - run: node --version && make check-fpga-decoder
        if: ${{ !cancelled() }}
      # Each FPGA image's decode, netlist, structure and fast simulation
      # against tools/fpga/ref, and the explainer page built
      # (docs/firmware/fpga-comparison.md, "Reproduce"); the long runs,
      # check-readings, are not CI's.
      - run: make -f tools/fpga/Makefile check
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers IMAGE=58503a-3704
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers IMAGE=z3801a-3543
        if: ${{ !cancelled() }}
      - run: make check-comment-addresses
        if: ${{ !cancelled() }}
      - run: make check-common
        if: ${{ !cancelled() }}
      - run: make check-plain-names
        if: ${{ !cancelled() }}
      # Without IMAGE, for every image with an export: each hand-written
      # .c compiled alone after the export's declarations and headers.
      - run: make check-alone IMAGE=
        if: ${{ !cancelled() }}
      - run: make check-decompiled
        if: ${{ !cancelled() }}
      - run: make check-decompiled IMAGE=58503a-3704
        if: ${{ !cancelled() }}
      - run: make check-decompiled IMAGE=z3801a-3543
        if: ${{ !cancelled() }}
      # The Z3815A 4010's export; its link and function checks run with
      # the other reported images', below.
      - run: make check-types IMAGE=z3815a-4010
        if: ${{ !cancelled() }}
      - run: make check-scpi-tree IMAGE=z3815a-4010
        if: ${{ !cancelled() }}
      - run: make check-magic-numbers IMAGE=z3815a-4010
        if: ${{ !cancelled() }}
      - run: make check-decompiled IMAGE=z3815a-4010
        if: ${{ !cancelled() }}
      # Without IMAGE, for every reported image: fails if one does not link
      # from its hand-written C and assembly alone, every function
      # required, and saves the summary the figures check reads.
      - run: make check-link IMAGE=
        if: ${{ !cancelled() }}
      # Without IMAGE, for every image: fails on a failed function, and
      # checks the documents' figures from each image's function check
      # against its report.
      - run: make report-decompiled IMAGE=
        if: ${{ !cancelled() }}
