name: pages

# The pages, `make pages`, built from their sources (the hand-written
# ones' in docs/pages/) and, on main, published on GitHub Pages at
# https://charlieh0tel.github.io/smartclock/<page>.html.  docs/ keeps a
# page forwarding to each one's old path.
#
# On pull requests too, building without publishing, so that a change
# breaking a page fails before it lands.  Pages must be enabled in the
# repository's settings with GitHub Actions as its source.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The pin audit.yml carries; moved by hand to match it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # serialport, under the library smartclock-cli links, needs
      # libudev.  The compiler is the one rust-toolchain.toml names,
      # which rustup installs on the first cargo call.  The FPGA
      # explainer decodes the bitstreams in node (web.yml's pin), with
      # the viewer cloned at its pinned commit, and runs the fast
      # simulations its waveforms come from in Icarus Verilog; the
      # detail page draws from the same decodes.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev iverilog
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The pForth words page reads the images with
      # tools/firmware/pforth_words.py, whose Capstone `uv run` installs
      # from the script's inline metadata; uv is firmware.yml's pin.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.2"
          enable-cache: true
          cache-dependency-glob: "tools/firmware/pforth_words.py"
      - run: node --version && iverilog -V | head -n 1 && uv --version
      - run: make pages PAGES_DIR=_site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    # One deployment at a time, the newest last; one in progress is not
    # cancelled, so a published site is never half replaced.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
