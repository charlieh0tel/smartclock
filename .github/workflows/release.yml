name: release

on:
  push:
    tags: ["v*"]

jobs:
  # One call of the shared workflow per package, each naming the crate
  # that carries its [package.metadata.deb]: smartclock-cli makes
  # smartclock-utils, smartclockd makes smartclockmon.  Each package
  # ships binaries of crates other than its own, which `package:` alone
  # would not build (cargo-deb: "Static file asset has not been built"),
  # so `build-workspace` builds the whole workspace first.  Each call
  # releases its own package onto the same tag; the release jobs share a
  # concurrency group, so they write the release one after the other.
  # The jobs below wait for both, so the notes, the zip and the apt
  # repository follow a release that carries both packages.
  #
  # Scoped to each job.  At workflow level it would also be granted to
  # the dispatch job below, which writes nothing here.
  #
  # serialport needs libudev on Linux.  No toolchain input:
  # rust-build-deb reads the channel out of rust-toolchain.toml itself,
  # so the published packages are built by the compiler this repo names,
  # without the version having to be kept equal in two places.
  deb-utils:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    permissions:
      contents: write
    with:
      package: smartclock-cli
      artifact-suffix: smartclock-utils
      build-workspace: true
      build-deps: "libudev-dev"

  deb-monitor:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    permissions:
      contents: write
    with:
      package: smartclockd
      artifact-suffix: smartclockmon
      build-workspace: true
      build-deps: "libudev-dev"

  # The release the deb jobs created carries only a compare link; its
  # notes are the changelog entry the release commit wrote, so the page
  # says what changed without anyone pasting it in.
  notes:
    needs: [deb-utils, deb-monitor]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set the release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./packaging/release-notes.sh > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

  # The Windows programs, zipped onto the release the deb jobs created.
  # Unsupported, as their README and the release notes say.
  windows:
    needs: [deb-utils, deb-monitor]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # The pin audit.yml carries; moved by hand to match it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo build --release --locked --workspace --bins
      - name: Attach the zip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="smartclockmon-${GITHUB_REF_NAME#v}-windows-x86_64"
          packaging/bundle.sh "dist/$name" packaging/windows-release.txt "$GITHUB_SHA"
          (cd dist && 7z a -tzip "$name.zip" "$name")
          gh release upload "$GITHUB_REF_NAME" "dist/$name.zip"

  trigger-apt-repo:
    needs: [deb-utils, deb-monitor]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      # workflow_dispatch, not repository_dispatch: the token then needs
      # Actions: write on apt-repo instead of Contents: write, which could
      # push a commit to the workflow that runs with the GPG signing key.
      - name: Trigger APT repo rebuild
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: gh workflow run update-repo.yml -R charlieh0tel/apt-repo
