name: web

# The browser tests for smartclock-web's pages, `make test-web`: every
# page against a faked API, for switching receivers, a daemon going and
# coming back, and the other edges they must handle alike.
#
# Separate from ci.yml because that one is the shared definition every
# repository in the fleet calls, and this needs Node and a browser the
# others do not.  Narrowed to the files that can change what it tests:
# smartclock-web, the workspace crates it links, the workspace manifest
# and lock file, the compiler pin, and the Makefile whose target it runs.
# On a push `paths` narrows it; on a pull request the `changed` job
# does, since main's ruleset requires `pages` and a workflow filtered
# out never reports.  A job skipped by its `if` passes a required
# check.  The list is so in two places, `paths` and `changed`'s
# pattern, kept alike by hand: `changed` reads one commit's difference,
# right for a pull request's merge commit but not for a push of
# several commits, which `paths` judges whole.
on:
  push:
    branches: [main]
    paths:
      - "crates/smartclock-web/**"
      - "crates/smartclock/**"
      - "crates/smartclock-log/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/workflows/web.yml"
  pull_request:

jobs:
  # Whether anything the push's `paths` name changed: always on a push,
  # and on a pull request if its merge commit differs from main there.
  changed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      test: ${{ steps.diff.outputs.test }}
    steps:
      # The pin below; two commits deep, the merge commit and main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            git diff --name-only HEAD^1 HEAD |
            grep -qE '^(crates/(smartclock-web|smartclock|smartclock-log)/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|Makefile$|\.github/workflows/web\.yml$)'
          then
            echo test=true >> "$GITHUB_OUTPUT"
          fi

  pages:
    needs: changed
    if: needs.changed.outputs.test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The pin audit.yml carries; moved by hand to match it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/smartclock-web/tests/browser/package-lock.json
      # serialport, under the library the server links, needs libudev.
      # The compiler is the one rust-toolchain.toml names, which rustup
      # installs on the first cargo call.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # Playwright's Chromium into the test directory, as `make web-deps`
      # does, with the system libraries it needs on a bare runner.
      - run: npm ci --no-fund --no-audit
        working-directory: crates/smartclock-web/tests/browser
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
        working-directory: crates/smartclock-web/tests/browser
      - run: make test-web
