name: web

# The browser tests, `make test-web`: smartclock-web's pages against a
# faked API, for switching receivers, a daemon going and coming back,
# and the other edges they must handle alike; and smartclock-emu's
# panel page, against a faked run and a running 58503A.  And the
# emulator's browser build, `make test-emulator-web`, in Node and in
# Chromium, a job of its own.
#
# Separate from ci.yml because that one is the shared definition every
# repository in the fleet calls, and this needs Node and a browser the
# others do not.  Narrowed to the files that can change what it tests:
# smartclock-web, the workspace crates it links, the workspace manifest
# and lock file, the compiler pin, and the Makefile whose target it runs;
# and the panel page, served by the emulator, which runs a board file and
# the 58503A's image and EEPROM from the bench unit.
# On a push `paths` narrows it; on a pull request the `changed` job
# does, since main's ruleset requires `pages` and a workflow filtered
# out never reports.  A job skipped by its `if` passes a required
# check.  The list is so in two places, `paths` and `changed`'s
# pattern, kept alike by hand: `changed` reads one commit's difference,
# right for a pull request's merge commit but not for a push of
# several commits, which `paths` judges whole.
on:
  push:
    branches: [main]
    paths:
      - "crates/smartclock-web/**"
      - "crates/smartclock/**"
      - "crates/smartclock-log/**"
      - "crates/smartclock-emu/**"
      - "crates/smartclock-sim/**"
      - "boards/**"
      - "third_party/firmware/images/58503a-3704.bin"
      - "third_party/firmware/images/eeprom/58503a-3710A01056-eeprom.bin"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - "crates/smartclock-emu-web/**"
      - "tools/install-wasm-bindgen.sh"
      - ".github/workflows/web.yml"
  pull_request:

jobs:
  # Whether anything the push's `paths` name changed: always on a push,
  # and on a pull request if its merge commit differs from main there.
  changed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      test: ${{ steps.diff.outputs.test }}
    steps:
      # The pin below; two commits deep, the merge commit and main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            git diff --name-only HEAD^1 HEAD |
            grep -qE '^(crates/(smartclock-web|smartclock|smartclock-log|smartclock-emu|smartclock-sim|smartclock-emu-web)/|boards/|third_party/firmware/images/(58503a-3704\.bin|eeprom/58503a-3710A01056-eeprom\.bin)$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|Makefile$|tools/install-wasm-bindgen\.sh$|\.github/workflows/web\.yml$)'
          then
            echo test=true >> "$GITHUB_OUTPUT"
          fi

  pages:
    needs: changed
    if: needs.changed.outputs.test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The pin audit.yml carries; moved by hand to match it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/smartclock-web/tests/browser/package-lock.json
      # serialport, under the library the servers link, needs libudev.
      # The compiler is the one rust-toolchain.toml names, which rustup
      # installs on the first cargo call; the emulator's mc683xx core is
      # Rust from crates.io and needs nothing more.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      # Playwright's Chromium into the test directory, as `make web-deps`
      # does, with the system libraries it needs on a bare runner.
      - run: npm ci --no-fund --no-audit
        working-directory: crates/smartclock-web/tests/browser
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
        working-directory: crates/smartclock-web/tests/browser
      - run: make test-web

  emulator-web:
    # The emulator's browser build, the 58503A's (make emulator-web), the
    # directory `make pages` publishes, booted in Node and in
    # Playwright's Chromium (make test-emulator-web).  The wasm32 target
    # goes on the compiler rust-toolchain.toml names; the wasm-bindgen
    # CLI is the release's prebuilt binary at the crate's exact version,
    # checked against its SHA-256 (tools/install-wasm-bindgen.sh), in
    # seconds where `cargo install` would build it for minutes.
    needs: changed
    if: needs.changed.outputs.test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/smartclock-web/tests/browser/package-lock.json
      - run: rustup target add wasm32-unknown-unknown
      - run: |
          sh tools/install-wasm-bindgen.sh "$RUNNER_TEMP/wasm-bindgen"
          echo "$RUNNER_TEMP/wasm-bindgen" >> "$GITHUB_PATH"
      - run: npm ci --no-fund --no-audit
        working-directory: crates/smartclock-web/tests/browser
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
        working-directory: crates/smartclock-web/tests/browser
      # The pin rust-ci.yml carries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: make test-emulator-web
