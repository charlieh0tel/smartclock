# Do not add default-members.  CI runs a bare `cargo test`, which covers
# every member only while this is absent; one was added once and cut the
# run from 76 tests to 0, exit 0, CI green while testing nothing.
[workspace]
members = [
    "crates/smartclock",
    "crates/smartclock-cli",
    "crates/smartclock-emu",
    "crates/smartclock-emu-web",
    "crates/smartclock-exporter",
    "crates/smartclock-gps",
    "crates/smartclock-gps-feed",
    "crates/smartclock-gps-ublox",
    "crates/smartclock-log",
    "crates/smartclock-sensord",
    "crates/smartclock-sim",
    "crates/smartclock-ubx",
    "crates/smartclock-web",
    "crates/smartclockd",
]
resolver = "3"

[workspace.package]
version = "1.10.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Christopher Hoover <ch@murgatroid.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/charlieh0tel/smartclock"

# Stripped in the packaged build: lintian objects to unstripped
# binaries, and debug symbols triple the size of a package whose point
# is to sit on a machine and log.
[profile.release]
strip = "symbols"

# Optimized, with the dev profile's debug assertions and overflow
# checks kept, for tests too slow unoptimized: the emulator's in CI
# (`make emulator EMULATOR_PROFILE=checked`).  The mc683xx crates
# debug_assert!, and an overflow in a device model is a bug to catch.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

# mc683xx, the emulator's CPU core, optimized in the dev profile too:
# its interpretation of the CPU32 is nearly all of an emulator test's
# time, and unoptimized it makes `cargo test` a matter of minutes, not
# seconds.  smartclock's own crates stay unoptimized, with their debug
# information.
[profile.dev.package.mc683xx-board]
opt-level = 3

[profile.dev.package.mc683xx-cpu32]
opt-level = 3

[profile.dev.package.mc683xx-mc68331]
opt-level = 3

[profile.dev.package.mc683xx-modules]
opt-level = 3

[profile.dev.package.mc683xx-peripherals]
opt-level = 3

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
doc_markdown = "warn"
enum_glob_use = "deny"
todo = "warn"

