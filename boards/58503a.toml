# HP 58503A main board, 58503-60001 Rev C, as its 3633 and 3704 images
# drive it.
#
# Format, confidence key and doc names as z3805a.toml and
# boards/README.md.  Both images program the Z3805A's map but for CS4,
# which neither sets up (read: chip-selects.md; 58503a-3704.md,
# "Hardware", "Chip select 4"), and the same port setup (PEPAR 0x32,
# PFPAR 0x04, DDRE 0x40, DDRF 0xf7, DDRGP 0xbc; read at 0x640 to 0x668,
# 0x1449c / 0x14614 on).  3704's facts are read from 3704; where 3633's
# were not checked the line says so.

version = 1

# schema: draft
[board]
name = "58503a"
title = "HP 58503A, 58503-60001 Rev C"                    # board: the bench unit (hardware-investigations.md, "Working on the open Z3805A board")
images = [
  "../third_party/firmware/images/58503a-3704.bin",       # read: the bench unit's
  "../third_party/firmware/images/58503a-3633.bin",       # read
]
# schema: draft -- a board option the runner turns on
options = ["front-panel"]                                 # read: Option 001, probed by a self-test at start (58503a-3704.md, "The front panel"); board: fitted on the bench unit

[chip]
type = "mc68331"                                          # inferred: the image programs an MC68331's SIM, QSM and GPT
reference_hz = 32768                                      # read: SYNCR 0xcf80 (3704, 3633's primary) and 0xcf00 (3633's boot), 16.777 MHz (58503a-3704.md, "Hardware"); board: the crystal not read
# data: open
autovector = []                                           # read: CS10 vectored IACK at level 2 (chip-selects.md)

# ---------------------------------------------------------------- memory

[[memory]]
name = "flash_low"
image = "../third_party/firmware/images/58503a-3704.bin"  # read: the image's first half; schema: draft, which of [board] images
image_offset = 0x00000                                    # schema: draft
size = 0x40000                                            # read: CSBARBT block 256 KiB; inferred: two Am29F010, the AMD-flash boot check of each pair's lanes (restart.md, "The installer", "Boot check")
attach = [
  { select = "CSBOOT", role = "read" },                   # read: CSBARBT 0x0005, CSORBT 0x6870 (3704 0x1454c, 3633 0x143d4)
  { select = "CS6", role = "write" },                     # read: CSBAR6 0x0005, CSOR6 0x7070
]

[[memory]]
name = "flash_high"
image = "../third_party/firmware/images/58503a-3704.bin"  # read: the second half
image_offset = 0x40000                                    # schema: draft
size = 0x40000                                            # read: CSBAR1 block 256 KiB
attach = [
  { select = "CS1", role = "read" },                      # read: CSBAR1 0x0405, CSOR1 0x6870
  { select = "CS7", role = "write" },                     # read: CSBAR7 0x0405, CSOR7 0x7070
]

[[memory]]
name = "ram"
size = 0x10000                                            # read: CS0/2/3 64 KiB (restart.md, "The chip selects", "The RAM"); open: the parts
writable = true
attach = [
  { select = "CS0", role = "read" },                      # read: CSBAR0 0x1003, CSOR0 0x6830
  { select = "CS2", role = "write", lane = "upper" },       # read: CSOR2 0x5030
  { select = "CS3", role = "write", lane = "lower" },       # read: CSOR3 0x3030
]

# ---------------------------------------------------------------- bus peripherals

[[peripheral]]
name = "duart"
type = "scc68692"
irq = 2                                                   # inferred: CS10 level 2 IACK, PFPAR 0x04 (as z3805a.toml)
reset = ["power-on", "external"]                          # inferred: as z3805a.toml
attach = [
  { select = "CS8", lines = [1, 2, 3, 4], lane = "lower" },  # read: CSBAR8 0x2000, CSOR8 0x3bf0; RS1 to RS4 on ADDR1 to ADDR4 (as z3805a.toml)
  { select = "CS10", role = "iack", lane = "lower" },     # read: CSBAR10 0xfff8, CSOR10 0x2bc4
]
dsack = "DSACK1"                                        # inferred: DSACK1 alone gives a 16-bit port (MC68331UM 4.4.2, Table 4-12), the DUART on its lower lane, odd addresses; PEPAR 0x32 (3704 0x14614)
marking = "SCC68692C1A44"                                 # board: U3, the Z3805A's part (hardware-investigations.md, item 4)
parameters = { x1_hz = 3686400 }                                       # inferred: the Z3805A's Y1; read: 3704's boot ACR 0xa0, counter from channel B's 1X clock (58503a-3704.md, "Hardware")

[[decoder]]
name = "cs5_decoder"                                      # inferred: as z3805a.toml
select = "CS5"                                            # read: CSBAR5 0x3003, CSOR5 0x7b30
address_bits = [13, 14]                                   # read: latch 0x300000, FPGA 0x304000, strobe 0x306000; open: a third input
undecoded = "open-bus"                                    # open

[[peripheral]]
name = "latch"
type = "74x374"                                           # inferred: as z3805a.toml
reset = []                                                # inferred: as z3805a.toml; open: the part, not identified on this board (item 24)
attach = [
  { decoder = "cs5_decoder", output = 0, role = "write", lines = 0 },  # read: 0x23b50 and the front panel's 0x53736 write 0x300000 (3704; 58503a-3704.md, "The front panel")
]

[[peripheral]]
name = "switch"
type = "74x244"                                           # inferred: as z3805a.toml
attach = [
  { decoder = "cs5_decoder", output = 1, role = "read", lines = 0 },  # read: only 3633's Oman installer reads 0x302000 (restart.md, "The switch byte at `0x302000`")
]
parameters = { levels = 0xff }                            # inferred: bit 0 set keeps the installer's settings (restart.md); open: whether it is S1

[[peripheral]]
name = "fpga"
type = "xc3042"
attach = [
  { decoder = "cs5_decoder", output = 2, lines = 3 },     # read: write routine 0x40784 (outputs.md, "What the 58503A drives"); lines inferred from the Z3805A design
  { qspi = 6, mask = 0xf },                               # inferred: the same loader and readback (58503a-3704.md, "Hardware")
]
marking = "XC3042"                                        # board: U32 (board-atlas.html, "Across the three boards")
[peripheral.parameters]
design = "58503a-z3801a"                                  # read: the design of 58503a-z3801a.bit; 3704 at 0x1fd16, 3633 at 0x1ff84, sha1 e8789ce4 (outputs.md, "The FPGA bitstreams")
# board: U31, an empty PLCC-84 socket (board-atlas.html)

[[peripheral]]
name = "efc_strobe"
type = "efc-strobe"                                       # inferred: the EFC DAC's load, as the emulator models it (ocxo.rs); open: what it strobes
attach = [
  { decoder = "cs5_decoder", output = 3, role = "write", lines = 0 },  # read: clr.b 0x306000, 3704 0x1f2c0, 3633 0x1f52e
]
# open: what it strobes

[[peripheral]]
name = "eeprom"
type = "at28c64b"
attach = [
  { select = "CS9", lines = 13 },                         # read: CSBAR9 0x4001, CSOR9 0x78f0
]
marking = "AT28C64B"                                      # board: U4 (hardware-investigations.md, item 22)
[peripheral.parameters]
image = "../third_party/firmware/images/eeprom/58503a-3710A01056-eeprom.bin"  # board: the bench unit's dump
write_cycle_us = 5000                                     # inferred: as z3805a.toml

# schema: draft
[[unconnected]]
select = "CS4"                                            # read: no image writes CSBAR4/CSOR4, BYTE disabled; 3633's boot code makes the pin PC1, never written, high (58503a-3704.md, "Chip select 4"); open: pin 119 (item 26)

# ---------------------------------------------------------------- QSPI peripherals

[[peripheral]]
name = "front_panel"
type = "hp58503a-front-panel"
attach = [{ qspi = 0, mask = 0xf }]                       # read: device 0, SPCR0 0xa302, command RAM 0x40, PCS3 to PCS0 all low (58503a-3704.md, "The front panel"); open: whether a PCS decode reaches it (item 24)
# schema: draft
option = "front-panel"                                    # read: root_task starts fpnl only if 0x537ea's self-test passes
# board: twelve-character VFD and eight keys with lamps (097-58503-08);
# its connector J15 or a 2 x 8 header, open (item 24)

[[peripheral]]
name = "adc"
type = "adc0838"
attach = [{ qspi = 1, mask = 0xf }]                       # inferred: both images have the DACs and the ADC (58503a-3704.md, "Hardware"); the Z3805A's code table
marking = "ADC0838CCV"                                    # board: U35 (board-atlas.html)
parameters = { vref_volts = 5.0, noise_volts = 0.0068359375 }  # inferred: as z3805a.toml

[[peripheral]]
name = "hex_dac"
type = "mc144110"
attach = [{ qspi = 2, mask = 0xf }]                       # inferred: as adc
marking = "MC144110"                                      # board: U37
parameters = { vdd_volts = 5.0 }                          # inferred: as z3805a.toml; open: its VDD rail (item 23)

# inferred: initial 0x8000, mid-scale, as z3805a.toml
[[peripheral]]
name = "efc_shift"
type = "74x164"                                           # inferred: two 74HC164s, as on the Z3801A (efc.md; hardware-investigations.md, item 27)
attach = [{ qspi = 7, mask = 0xf }]                       # inferred: as adc
parameters = { cascade = 2, miso = "qh", initial = 0x8000 }                 # inferred: as z3805a.toml (efc.md; item 27)

[[peripheral]]
name = "efc_dac"
type = "ad569"                                            # inferred: part from efc.md (Tom Van Baak's Z3801A traces)
# inferred: initial 0x8000, mid-scale, as z3805a.toml
parameters = { cs = "low", hbe = "low", ldac = "low", vref_negative_volts = -5.0, vref_positive_volts = 5.0, initial = 0x8000 }  # inferred: as z3805a.toml (efc.md; item 27)

# ---------------------------------------------------------------- beside the bus

[[peripheral]]
name = "interpolator"
type = "smartclock-interpolator"                          # inferred: U36 TLC0820AC (board: board-atlas.html)
[peripheral.parameters]
trim_vss = 0.0                                            # inferred: as hex_dac's vss_volts
trim_vdd = 5.0                                            # inferred: as hex_dac's vdd_volts

[[peripheral]]
name = "ocxo"
type = "ocxo"
marking = "HP 10811-60159"                                # board: the bench unit's (ocxo.md); EFC +/- 2e-7 over -5 V to +5 V (efc.md)
[peripheral.parameters]
hz = 10_000_000                                           # read: 100 ns ticks
efc_gain = 6.25e-13                                       # read: as the Z3805A's; board: measured +3.94e-13, sign agrees (hardware-investigations.md, item 2; efc.md, "The pull, measured")
efc_vref_negative = -5.0                                  # inferred: as efc_dac's vref_negative_volts
efc_vref_positive = 5.0                                   # inferred: as efc_dac's vref_positive_volts
adc_vref_volts = 5.0                                      # inferred: as adc's vref_volts

[[peripheral]]
name = "board_temperature"
type = "temperature-sensor"                               # read: 3633 has the adc_ words (console.md, "In every image"); open: 3704 drops them, the channel map
[peripheral.parameters]
adc_vref_volts = 5.0                                      # inferred: as adc's vref_volts

[[peripheral]]
name = "supplies"
type = "supply-monitor"                                   # inferred: as board_temperature
[peripheral.parameters]
adc_vref_volts = 5.0                                      # inferred: as adc's vref_volts

[[peripheral]]
name = "gps"
type = "oncore"
[peripheral.parameters]
protocol = "motorola-binary"                              # read: @@ messages (gps.md)
engine = "b4121"                                          # read: able to take an eight-channel engine (58503a-3704.md, "Hardware"); inferred: the emulator's VP Oncore B4121P1115 (emulator.md); open: whether the bench engine runs at eight

[[peripheral]]
name = "lamps"
type = "lamp-board"                                       # read: Power, GPS Lock, Holdover, Alarm (097-58503-08; 58503a-3704.md)

[[peripheral]]
name = "leds"
type = "led-bank"
parameters = { count = 6 }                                # board: six LEDs on the main board (hardware-investigations.md, item 17)

# ---------------------------------------------------------------- nets

[[net]]
name = "gps-to-duart"
type = "serial"
from = "gps.tx"
to = ["duart.RxDA"]                                        # read: channel A the GPS engine (58503a-3704.md, "Hardware")

[[net]]
name = "duart-to-gps"
type = "serial"
from = "duart.TxDA"
to = ["gps.rx"]                                           # read

[[net]]
name = "gps-pps"
type = "edge"
from = "gps.pps"
to = ["fpga.P82", "chip.PAI"]                             # inferred: P82 from the Z3805A design (counter.md), this design's I/O blocks differing only on P14, P45 (outputs.md)

[[net]]
name = "ten-megahertz"
type = "clock"
from = "ocxo.out"
to = ["fpga.P7"]                                          # inferred: as gps-pps

[[net]]
name = "fpga-pps"
type = "edge"
from = "fpga.pps"
to = ["chip.PGP0"]                                        # inferred: IC1, pps_interrupt (58503a-3704.md, "The front panel": fpnl waits on its signal); open: the pin; board: J4 fitted, no 1 PPS (item 19)

[[net]]
name = "fpga-init"
type = "logic"
from = "fpga.INIT"
to = ["chip.PCLK"]                                        # inferred: the same loader (58503a-3704.md, "Hardware")

# schema: draft
[[net]]
name = "fpga-done"
type = "wired-and"
from = ["fpga.DONE", "chip.PF3"]
to = ["chip.PF3", "fpga.DONE"]                           # read: the loader drives and reads DONE on bit 3 in both (58503a-3704.md, "Hardware")

[[net]]
name = "fpga-program"
type = "logic"
from = "chip.PE6"
to = ["fpga.RESET"]                                       # inferred: the same loader; read: PORTE0 0x40, DDRE 0x40

[[net]]
name = "fpga-readback"
type = "logic"
from = "chip.PF6"
to = ["fpga.M0"]                                          # read: the loader moves PF3, PF6 and PF7 only (0x2260c, 0x230c8; 58503a-3704.md, "The alarm outputs")

[[net]]
name = "alarm-out"
type = "logic"
from = "chip.PF5"
to = ["external.alarm"]                                   # read: 0x40828 drives PF5 low while the alarm is on (3704; 58503a-3704.md, "The alarm outputs"); open: whether PF5 or FPGA register 3 bit 2 is the rear Alarm (item 25), and 3633

[[net]]
name = "efc-load"
type = "logic"
from = "efc_strobe.out"
to = ["efc_dac.LBE"]                                      # inferred: the AD569's /LBE pulse, as on the Z3805A (z3805a.toml; efc.md; item 27); open: the wiring

[[net]]
name = "efc-word"
type = "bus"
from = "efc_shift.Q"
to = ["efc_dac.DB"]                                       # inferred: as z3805a.toml

[[net]]
name = "efc"
type = "analog"
from = "efc_dac.VOUT"
to = ["ocxo.efc"]                                         # inferred: efc.md; board: the EFC pin follows the count (efc.md, "The pin follows the count")

[[net]]
name = "adc-temperature"
type = "analog"
from = "board_temperature.out"
to = ["adc.CH0"]                                          # pin: SNAS531B Table 2, 3704 numbering pins itself (adc_read); inferred: the Z3805A's channel 0 (z3805a.toml); read: 3704's qspi_adc_test wants a reading neither 0 nor 0xff; open: this board's map

[[net]]
name = "adc-double-oven"
type = "analog"
from = "ocxo.outer_oven_monitor"
to = ["adc.CH2"]                                          # pin: SNAS531B Table 2, 3704 numbering pins itself (adc_read); inferred: the Z3805A's channel 1 (z3805a.toml); read: 3704's qspi_adc_test wants a reading neither 0 nor 0xff; open: this board's map

[[net]]
name = "adc-plus-15v"
type = "analog"
from = "supplies.plus_15v"
to = ["adc.CH4"]                                          # pin: SNAS531B Table 2, 3704 numbering pins itself (adc_read); inferred: the Z3805A's channel 2 (z3805a.toml); read: 3704's qspi_adc_test wants a reading neither 0 nor 0xff; open: this board's map

[[net]]
name = "adc-current"
type = "analog"
from = "ocxo.oven_current"
to = ["adc.CH6"]                                          # pin: SNAS531B Table 2, 3704 numbering pins itself (adc_read); inferred: the Z3805A's channel 3 (z3805a.toml); read: 3704's qspi_adc_test wants a reading neither 0 nor 0xff; open: this board's map

[[net]]
name = "adc-5v"
type = "analog"
from = "supplies.plus_5v"
to = ["adc.CH1"]                                          # pin: SNAS531B Table 2, 3704 numbering pins itself (adc_read); inferred: the Z3805A's channel 4 (z3805a.toml); read: 3704's qspi_adc_test wants a reading neither 0 nor 0xff; open: this board's map

[[net]]
name = "adc-oven"
type = "analog"
from = "ocxo.oven_monitor"
to = ["adc.CH3"]                                          # pin: SNAS531B Table 2, 3704 numbering pins itself (adc_read); inferred: the Z3805A's channel 5 (z3805a.toml); read: 3704's qspi_adc_test wants a reading neither 0 nor 0xff; open: this board's map

[[net]]
name = "adc-minus-15v"
type = "analog"
from = "supplies.minus_15v"
to = ["adc.CH5"]                                          # pin: SNAS531B Table 2, 3704 numbering pins itself (adc_read); inferred: the Z3805A's channel 6 (z3805a.toml); read: 3704's qspi_adc_test wants a reading neither 0 nor 0xff; open: this board's map
[[net]]
name = "outer-oven"
type = "logic"
from = "chip.PGP5"
to = ["ocxo.outer_oven"]                                  # read: 3633 raises PGP5 (0x46016, 0x462aa), 3704 only from doven (ovens.md, "In every image"); open: the pin's wiring here

[[net]]
name = "trim-low"
type = "analog"
from = "hex_dac.R4Out"
to = ["interpolator.trim_low"]                            # read: 3704's ti.c trims slot 2, TI_HDAC_SLOT_LOW; inferred: wired as the Z3805A's (z3805a.toml)

[[net]]
name = "trim-high"
type = "analog"
from = "hex_dac.R3Out"
to = ["interpolator.trim_high"]                           # read: 3704's ti.c trims slot 3, TI_HDAC_SLOT_HIGH; inferred: as trim-low

[[net]]
name = "interpolator-byte"
type = "bus"
from = "interpolator.byte"
to = ["fpga.P3-P6,P8-P11"]                                # inferred: the Z3805A's (counter.md, "What the netlist shows"), the design's I/O blocks differing only on P14, P45 (outputs.md)

[[net]]
name = "lamp-gps-lock"
type = "logic"
from = "latch.Q0"
to = ["lamps.gps_lock"]                                   # read: 3704 bit 0 (58503a-3704.md, "The four lamps"); open: 3633's bits

[[net]]
name = "lamp-holdover"
type = "logic"
from = "latch.Q1"
to = ["lamps.holdover"]                                   # read: 3704 bit 1

[[net]]
name = "lamp-alarm"
type = "logic"
from = "latch.Q2"
to = ["lamps.alarm"]                                      # read: 3704 bit 2

[[net]]
name = "panel-frame"
type = "logic"
from = "latch.Q6"
to = ["front_panel.frame"]                                # read: bit 6 low from a command's first byte to its last (0x53736, 0x53796); inferred: a frame select; open: the wiring (item 24)

[[net]]
name = "panel-run"
type = "logic"
from = "latch.Q7"
to = ["front_panel.run"]                                  # read: 0x537b2 holds bit 7 low 1 s between self-tests; inferred: the panel's reset while low

[[net]]
name = "led-heartbeat"
type = "logic"
from = "duart.OP2"
to = ["leds.heartbeat"]                                        # read: OP2 flipped at 0x239c6 (3633), 0x23c22 (3704) (outputs.md, "The heartbeat")

# inferred: OP3 to OP7 the self-test's LEDs, board_led's, as z3805a.toml

[[net]]
name = "led-installer"
type = "logic"
from = "duart.OP3"
to = ["leds.installer"]

[[net]]
name = "led-cpu"
type = "logic"
from = "duart.OP4"
to = ["leds.cpu"]

[[net]]
name = "led-ram"
type = "logic"
from = "duart.OP5"
to = ["leds.ram"]

[[net]]
name = "led-duart"
type = "logic"
from = "duart.OP6"
to = ["leds.duart"]

[[net]]
name = "led-selftest"
type = "logic"
from = "duart.OP7"
to = ["leds.selftest"]

# open: PORTGP bits 4 to 2, which 3633's DUART init writes 0 (outputs.md);
# PWMA, low while 3704's holdover-recovery flag is set (README.md).

# ---------------------------------------------------------------- run-time endpoints
# external.host: SCPI and the pForth console (read: DUART channel B,
# drtR/drtW, 58503a-3704.md, "What the Z3805A has and the 58503A does
# not").  No SCI: the 58503A writes no SCI register (read).
# external.alarm: the rear Alarm output, if PF5 is it (open).

[[net]]
name = "host-in"
type = "serial"
from = "external.host"
to = ["duart.RxDB"]                                        # read

[[net]]
name = "host-out"
type = "serial"
from = "duart.TxDB"
to = ["external.host"]                                    # read
