# HP Z3801A main board, Z3801-68001, as its 3543 image drives it.
#
# Format, confidence key and doc names as z3805a.toml and
# boards/README.md; z3801a-3543.md is docs/firmware/*.  The Z3801A 3543
# is the Z3805A 3543B less its SCI driver and ES message
# (z3801a-3543.md): the chip-select map is the Z3805A's, the same 26
# values in boot code and primary (read: chip-selects.md; restart.md,
# "The chip selects"), the port setup the same bytes (PEPAR 0x32, PFPAR
# 0x04, DDRE 0x40, DDRF 0xf7, DDRGP 0xbc, read at 0x142c2 to 0x142ea
# and 0x12068), and every routine that drives a part below relocated
# from the Z3805A's, the same instructions at its own addresses (read:
# diff/z3801a-3543-vs-z3805a-3543b.tsv), so the attachments, codes and
# pins are z3805a.toml's.  What differs: the FPGA design, the host
# port's framing, no SCI endpoint, and the parts, few of which are read
# off this board (board-atlas.html, "Across the three boards").  A
# line marked `as z3805a.toml` is a hardware fact not seen on this
# board, followed from the same code: read from the ROM, not the board.

version = 1

# schema: draft -- which images the board takes
[board]
name = "z3801a"
title = "HP Z3801A, Z3801-68001"                          # board: z3801a-main-board.jpg (board-atlas.html, "Across the three boards")
images = ["../third_party/firmware/images/z3801a-3543.bin"]      # read: 3543, the bench unit's

[chip]
type = "mc68331"                                          # board: U33 MC68331CFC16 (board-atlas.html, "Across the three boards")
reference_hz = 32768                                      # read: SYNCR 0xcf00 at 0x142b2, 16.777 MHz (console.md, "The Z3801A image"); inferred: a 32.768 kHz crystal, as z3805a.toml's Y2; open: not read on this board
# data: open                                            # inferred: as z3805a.toml, CSBOOT 16-bit
autovector = []                                           # read: CS10 answers level 2 vectored; no select sets AVEC, PEPAR 0x32 leaves PE2 port I/O (0x142c2; chip-selects.md)
# pins: open -- none traced.  The firmware reads PF3 (DONE) and PCLK
# (INIT) as inputs.

# ---------------------------------------------------------------- memory

# schema: draft -- image_offset, and two parts a bank, as z3805a.toml
[[memory]]
name = "flash_low"
image = "../third_party/firmware/images/z3801a-3543.bin"  # read: the image's first half
image_offset = 0x00000                                    # schema: draft
size = 0x40000                                            # read: CSBARBT block 256 KiB; inferred: two Am29F010, the installer's command words, the Z3805A's (restart.md, "The installer", "Erase and download"; z3801a-3543.md, "Layout")
attach = [
  { select = "CSBOOT", role = "read" },                   # read: CSBARBT 0x0005, CSORBT 0x6870 (0x141ea, 0x141f2; chip-selects.md)
  { select = "CS6", role = "write" },                     # read: CSBAR6 0x0005, CSOR6 0x7070
]
# board: flash labeled Z3801-8007 Rev ZB (bench.md); open: the parts

[[memory]]
name = "flash_high"
image = "../third_party/firmware/images/z3801a-3543.bin"  # read: the image's second half
image_offset = 0x40000                                    # schema: draft
size = 0x40000                                            # read: CSBAR1 block 256 KiB
attach = [
  { select = "CS1", role = "read" },                      # read: CSBAR1 0x0405, CSOR1 0x6870
  { select = "CS7", role = "write" },                     # read: CSBAR7 0x0405, CSOR7 0x7070
]

[[memory]]
name = "ram"
size = 0x10000                                            # read: CS0/2/3 block 64 KiB (restart.md, "The chip selects", "The RAM")
writable = true
attach = [
  { select = "CS0", role = "read" },                      # read: CSBAR0 0x1003, CSOR0 0x6830
  { select = "CS2", role = "write", lane = "upper" },       # read: CSOR2 0x5030, upper byte, write
  { select = "CS3", role = "write", lane = "lower" },       # read: CSOR3 0x3030, lower byte, write
]
# open: the parts, not read on this board

# ---------------------------------------------------------------- bus peripherals

[[peripheral]]
name = "duart"
type = "scc68692"                                         # inferred: U3 as on the Z3805A and 58503A, an SCC68692 at the same designator on both (board-atlas.html, "Across the three boards"); open: U3 is under the add-on board here
irq = 2                                                   # inferred: as z3805a.toml (CS10 the level 2 IACK; PFPAR 0x04 at 0x142da)
reset = ["power-on", "external"]                          # inferred: as z3805a.toml
attach = [
  { select = "CS8", lines = [1, 2, 3, 4], lane = "lower" },  # read: CSBAR8 0x2000, CSOR8 0x3bf0, 8-bit, external DSACK; register n at 2n+1 (mc68681.h)
  { select = "CS10", role = "iack", lane = "lower" },     # read: CSBAR10 0xfff8, CSOR10 0x2bc4, level 2, lower byte
]
dsack = "DSACK1"                                        # inferred: as z3805a.toml; PEPAR 0x32 makes only DSACK1 a bus pin (0x142c2)
marking = "open: under the add-on board"                  # board: board-atlas.html, "Across the three boards"
parameters = { x1_hz = 3686400 }                          # inferred: as z3805a.toml's Y1; read: the same counter test, duart_counter_test relocated (0x1e574 in the Z3805A)

[[decoder]]
name = "cs5_decoder"                                      # inferred: as z3805a.toml
select = "CS5"                                            # read: CSBAR5 0x3003, CSOR5 0x7b30, 8-bit, 12 wait (chip-selects.md)
address_bits = [13, 14]                                   # read: the four devices lie 8 KiB apart; open: a third input, ADDR15 or tied
undecoded = "open-bus"                                    # open: as z3805a.toml

[[peripheral]]
name = "latch"
type = "74x374"                                           # inferred: as z3805a.toml
reset = []                                                # inferred: a '574 has no clear (hardware-investigations.md, item 20)
attach = [
  { decoder = "cs5_decoder", output = 0, role = "write", lines = 0 },  # read: lamp_latch 0x300000, written by leds_update 0x464a8 and lamp_test 0x181f6
]
marking = "74ABT574AD"                                    # board: U44 beside J13 (item 20); inferred: that it is the latch

[[peripheral]]
name = "switch"
type = "74x244"                                           # inferred: as z3805a.toml; open: the part
attach = [
  { decoder = "cs5_decoder", output = 1, role = "read", lines = 0 },  # read: 0x302000 in CS5's window; 3543 never reads it (console.md, "The Z3801A image")
]
parameters = { levels = 0xff }                            # inferred: the emulator's, as z3805a.toml

[[peripheral]]
name = "fpga"
type = "xc3042"
attach = [
  { decoder = "cs5_decoder", output = 2, lines = 3 },     # read: fpga_port 0x304000, fpga_read 0x4076a, fpga_write 0x40756; inferred: ADDR0 to ADDR2 as z3805a.toml
  { qspi = 6, mask = 0xf },                               # read: fpga_program 0x21c68, the Z3805A's loader relocated (structures.md, "The QSPI's devices")
]
marking = "XC3042-70"                                     # board: U32 (board-atlas.html, "Across the three boards")
[peripheral.parameters]
design = "58503a-z3801a"                                  # read: the design of 58503a-z3801a.bit; bitstream at 0x1fddc, sha1 e8789ce4, the 58503A's (outputs.md, "The FPGA bitstreams")
# open: U31, bare pads (board-atlas.html)

[[peripheral]]
name = "efc_strobe"
type = "efc-strobe"                                       # inferred: the EFC DAC's load, as z3805a.toml
attach = [
  { decoder = "cs5_decoder", output = 3, role = "write", lines = 0 },  # read: efc_strobe 0x306000, written 0 by efc_write 0x1f34e after QSPI device 7
]

[[peripheral]]
name = "eeprom"
type = "at28c64b"
attach = [
  { select = "CS9", lines = 13 },                         # read: CSBAR9 0x4001, CSOR9 0x78f0, 8 KiB, 3 wait
]
marking = "Atmel, type unread"                            # board: U4 (board-atlas.html, "Across the three boards"); inferred: an AT28C64B, as z3805a.toml
[peripheral.parameters]
image = "../third_party/firmware/images/eeprom/z3801a-3542A01548-eeprom.bin"  # board: the bench unit's dump
write_cycle_us = 5000                                     # inferred: as z3805a.toml

# schema: draft -- a select programmed with nothing known on it
[[unconnected]]
select = "CS4"                                            # read: CSBAR4 0x5000, CSOR4 0x7830, never addressed (console.md, "The Z3801A image"); open: pin 119

# ---------------------------------------------------------------- QSPI peripherals
# The queue table and the drivers are the Z3805A's, relocated (read:
# structures.md, "The QSPI's devices"); the parts are inferred as
# z3805a.toml's, U35 and U37 not read on this board.

[[peripheral]]
name = "adc"
type = "adc0838"
attach = [{ qspi = 1, mask = 0xf }]                       # read: QSPI_ADC, code 1
[peripheral.parameters]
vref_volts = 5.0                                          # inferred: as z3805a.toml
noise_volts = 0.0068359375                                # inferred: as z3805a.toml

[[peripheral]]
name = "hex_dac"
type = "mc144110"
attach = [{ qspi = 2, mask = 0xf }]                       # read: QSPI_HDAC, code 2
parameters = { vdd_volts = 5.0 }                          # inferred: as z3805a.toml; open: its VDD rail (item 23)

# inferred: initial 0x8000, mid-scale, as z3805a.toml
[[peripheral]]
name = "efc_shift"
type = "74x164"                                           # inferred: two 74HC164s (efc.md, Tom Van Baak's Z3801A traces; item 27)
attach = [{ qspi = 7, mask = 0xf }]                       # read: QSPI_EFC, code 7
parameters = { cascade = 2, miso = "qh", initial = 0x8000 }                 # inferred: as z3805a.toml

[[peripheral]]
name = "efc_dac"
type = "ad569"
marking = "AD569"                                         # inferred: U56, fed by two 74HC164s (efc.md, Tom Van Baak's Z3801A traces)
# inferred: initial 0x8000, mid-scale, as z3805a.toml
parameters = { cs = "low", hbe = "low", ldac = "low", vref_negative_volts = -5.0, vref_positive_volts = 5.0, initial = 0x8000 }  # inferred: as z3805a.toml (efc.md; item 27)

# ---------------------------------------------------------------- beside the bus

[[peripheral]]
name = "interpolator"
type = "smartclock-interpolator"                          # board: U36 TLC0820AC (board-atlas.html, "Across the three boards"); inferred: wired as z3805a.toml
[peripheral.parameters]
trim_vss = 0.0                                            # inferred: as hex_dac's vss_volts
trim_vdd = 5.0                                            # inferred: as hex_dac's vdd_volts

[[peripheral]]
name = "ocxo"
type = "ocxo"
marking = "10811-60161"                                   # inferred: reported, in none of the sources (ocxo.md)
[peripheral.parameters]
hz = 10_000_000                                           # read: 100 ns ticks
efc_gain = 6.25e-13                                       # read: the fixed G (console.md, "The Z3801A image"); measured 6.0e-13 on the bench unit (ocxo.md)
efc_vref_negative = -5.0                                  # inferred: as efc_dac's vref_negative_volts
efc_vref_positive = 5.0                                   # inferred: as efc_dac's vref_positive_volts
adc_vref_volts = 5.0                                      # inferred: as adc's vref_volts

[[peripheral]]
name = "board_temperature"
type = "temperature-sensor"                               # read: ADC_TEMPERATURE, channel 0 (rewritten/z3801a-3543 smartclock.h adc_channel); open: the part
[peripheral.parameters]
adc_vref_volts = 5.0                                      # inferred: as adc's vref_volts

[[peripheral]]
name = "supplies"
type = "supply-monitor"                                   # read: ADC_5V 4, ADC_PLUS_15V 2, ADC_MINUS_15V 6 (smartclock.h); open: the dividers
[peripheral.parameters]
adc_vref_volts = 5.0                                      # inferred: as adc's vref_volts

[[peripheral]]
name = "gps"
type = "oncore"
[peripheral.parameters]
protocol = "motorola-binary"                              # read: @@ messages (gps.md, "In every image")
engine = "b1121"                                          # read: only the six-channel @@Bn (console.md, "The Z3801A image"); inferred: the emulator's VP Oncore B1121P1114, as z3805a.toml

[[peripheral]]
name = "lamps"
type = "lamp-board"                                       # read: leds_update relocated from the Z3805A's; 097-z3801-01 (1-2, 2-9): the front panel's lamps, Power not the firmware's

[[peripheral]]
name = "leds"
type = "led-bank"
parameters = { count = 6 }                                # read: the same OP2 to OP7 writes (outputs.md, "The rest of the bank"); open: the LEDs fitted

# board: no 1 PPS output as built, U17, U18, J4 and J5 not fitted
# (bench.md), so no z3805a.toml pps_out

# ---------------------------------------------------------------- nets
# The ADC's nets name its pins as z3805a.toml's (SNAS531B, Table 2).

[[net]]
name = "gps-to-duart"
type = "serial"
from = "gps.tx"
to = ["duart.RxDA"]                                       # read: channel A is the GPS link, drta_get_byte 0x1df40

[[net]]
name = "duart-to-gps"
type = "serial"
from = "duart.TxDA"
to = ["gps.rx"]                                           # read: drta_send_message 0x1de92

[[net]]
name = "gps-pps"
type = "edge"
from = "gps.pps"
to = ["fpga.P82", "chip.PAI"]                             # inferred: P82 from the Z3805A design (counter.md), this design's I/O blocks differing only on P14 and P45 and, by AL's exchanged outputs, the clocks of P71, P70, P67 and P65 (58503a-z3801a-trace.md); read: PAI counts it, gps_pps_check 0x2346a

[[net]]
name = "ten-megahertz"
type = "clock"
from = "ocxo.out"
to = ["fpga.P7"]                                          # inferred: as gps-pps

[[net]]
name = "fpga-pps"
type = "edge"
from = "fpga.pps"
to = ["chip.PGP0"]                                        # read: IC1 rising, pps_interrupt 0x12db6, vector 81 (pps.c); open: the pin

[[net]]
name = "fpga-init"
type = "logic"
from = "fpga.INIT"
to = ["chip.PCLK"]                                        # read: the loader reads INIT on PACTL's PCLKS (0x21d32)

# schema: draft -- DONE is open drain, driven by both ends
[[net]]
name = "fpga-done"
type = "wired-and"
from = ["fpga.DONE", "chip.PF3"]
to = ["chip.PF3", "fpga.DONE"]                            # read: DONE on PORTF bit 3, driven low by the loader while it waits for INIT (0x21cae to 0x21d08)

[[net]]
name = "fpga-program"
type = "logic"
from = "chip.PE6"
to = ["fpga.RESET"]                                       # read: FPGA_PROGRAM, port E bit 6; PORTE0 0x40, DDRE 0x40 (0x142ca, 0x142d2); inferred: the part's RESET, as z3805a.toml

[[net]]
name = "fpga-readback"
type = "logic"
from = "chip.PF6"
to = ["fpga.M0"]                                          # read: FPGA_READBACK_FIRST, PF6 (fpga.c); inferred: M0/RTRIG, as z3805a.toml

[[net]]
name = "efc-word"
type = "bus"
from = "efc_shift.Q"
to = ["efc_dac.DB"]                                       # inferred: the '164s' Q bit n on DBn (efc.md, Tom Van Baak's Z3801A traces; item 27)

[[net]]
name = "efc-load"
type = "logic"
from = "efc_strobe.out"
to = ["efc_dac.LBE"]                                      # inferred: as z3805a.toml (efc_write 0x1f34e strobes after QSPI device 7); open: the wiring

[[net]]
name = "efc"
type = "analog"
from = "efc_dac.VOUT"
to = ["ocxo.efc"]                                         # inferred: efc.md (Tom Van Baak's trace on a Z3801A)

[[net]]
name = "outer-oven"
type = "logic"
from = "chip.PGP5"
to = ["ocxo.outer_oven"]                                  # read: 0x45f84, 0x461fe set PORTGP bit 5 (ovens.md, "In every image"); inferred: P2/8 (ovens.md, "What others have measured")

[[net]]
name = "trim-low"
type = "analog"
from = "hex_dac.R4Out"
to = ["interpolator.trim_low"]                            # read: ti.c trims slot 2, relocated; inferred: wired as z3805a.toml

[[net]]
name = "trim-high"
type = "analog"
from = "hex_dac.R3Out"
to = ["interpolator.trim_high"]                           # read: ti.c trims slot 3; inferred: as trim-low

# schema: draft -- an 8-bit parallel bus between parts
[[net]]
name = "interpolator-byte"
type = "bus"
from = "interpolator.byte"
to = ["fpga.P3-P6,P8-P11"]                                # inferred: as z3805a.toml (counter.md, "What the netlist shows")

[[net]]
name = "adc-temperature"
type = "analog"
from = "board_temperature.out"
to = ["adc.CH0"]                                          # read: ADC_TEMPERATURE 0 (smartclock.h)

[[net]]
name = "adc-double-oven"
type = "analog"
from = "ocxo.outer_oven_monitor"
to = ["adc.CH2"]                                          # read: ADC_DOUBLE_OVEN 1, adc_doven 0.0743 ADC1 - 0.0472 ADC4 (ovens.md, "The Z3801A")

[[net]]
name = "adc-plus-15v"
type = "analog"
from = "supplies.plus_15v"
to = ["adc.CH4"]                                          # read: ADC_PLUS_15V 2

[[net]]
name = "adc-current"
type = "analog"
from = "ocxo.oven_current"
to = ["adc.CH6"]                                          # read: ADC_CURRENT 3, the oscillator current (ovens.md)

[[net]]
name = "adc-5v"
type = "analog"
from = "supplies.plus_5v"
to = ["adc.CH1"]                                          # read: ADC_5V 4

[[net]]
name = "adc-oven"
type = "analog"
from = "ocxo.oven_monitor"
to = ["adc.CH3"]                                          # read: ADC_OVEN 5, adc_oven 0.0743 ADC5 - 0.0472 ADC4 (ovens.md, "The Z3801A"); open: what it measures

[[net]]
name = "adc-minus-15v"
type = "analog"
from = "supplies.minus_15v"
to = ["adc.CH5"]                                          # read: ADC_MINUS_15V 6
# open: ADC channel 7, never named

[[net]]
name = "lamp-enabled"
type = "logic"
from = "latch.Q0"
to = ["lamps.enabled"]                                    # read: latch bit 0 Enabled, leds_update relocated (outputs.md, "The Z3805A's lamps"); open: the wiring

[[net]]
name = "lamp-active"
type = "logic"
from = "latch.Q1"
to = ["lamps.active"]                                     # read: bit 1 Active

[[net]]
name = "lamp-alarm"
type = "logic"
from = "latch.Q2"
to = ["lamps.alarm"]                                      # read: bit 2 Alarm

[[net]]
name = "lamp-gps-lock"
type = "logic"
from = "latch.Q4"
to = ["lamps.gps_lock"]                                   # read: bit 4 GPS Lock

[[net]]
name = "lamp-holdover"
type = "logic"
from = "latch.Q5"
to = ["lamps.holdover"]                                   # read: bit 5 Holdover
# open: latch bits 3, 6, 7 (nothing the firmware names)

[[net]]
name = "led-heartbeat"
type = "logic"
from = "duart.OP2"
to = ["leds.heartbeat"]                                   # read: OP2 flipped by hmon_task at 0x2372e (outputs.md, "The heartbeat"); open: which LED

# read: OP3 to OP7 the self-test's lamps (outputs.md, "The rest of the
# bank"), board_led's (smartclock.h); inferred: lit on a high pin;
# open: the order.
[[net]]
name = "led-installer"
type = "logic"
from = "duart.OP3"
to = ["leds.installer"]

[[net]]
name = "led-cpu"
type = "logic"
from = "duart.OP4"
to = ["leds.cpu"]

[[net]]
name = "led-ram"
type = "logic"
from = "duart.OP5"
to = ["leds.ram"]

[[net]]
name = "led-duart"
type = "logic"
from = "duart.OP6"
to = ["leds.duart"]

[[net]]
name = "led-selftest"
type = "logic"
from = "duart.OP7"
to = ["leds.selftest"]

# ---------------------------------------------------------------- run-time endpoints
# external.host: SCPI, and the pForth console after :SYST:LANG "PFORTH"
# on the same port (read: console.md, "The Z3801A image"), framed 7O1
# (097-z3801-01 1-8, 2-10: fixed; read: MR1B 0x06 from the NV record,
# the default duartb_settings_defaults 0x2f92a), which the emulator's
# far end follows (emulator.md, "The boards").  No SCI endpoint: the
# image's one reference to the SCI clears SCCR1 (read: 0x120da,
# console.md, "The Z3801A image").

[[net]]
name = "host-in"
type = "serial"
from = "external.host"
to = ["duart.RxDB"]                                       # read: scpi_port_open opens channel B, 0x1dbee

[[net]]
name = "host-out"
type = "serial"
from = "duart.TxDB"
to = ["external.host"]                                    # read: as host-in; board: RS-422 at J3, an AT&T part at U5 or U6 (board-atlas.html, "Across the three boards")
