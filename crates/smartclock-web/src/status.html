<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartClock status</title>

<link rel="stylesheet" href="/style.css">

<div class="panel" id="status"><span class="muted">connecting...</span></div>

<nav class="panel nav">
  <a href="/">Live</a>
  <a href="/status" aria-current="page">Status</a>
  <a href="/adev">Stability</a>
  <a href="/compare">Compare</a>
  <a href="/correlation">Correlation</a>
</nav>

<div class="panel" id="unit-bar" hidden>
  <div class="controls">
    <label for="unit">Receiver</label>
    <select id="unit"></select>
    <span class="grow"></span>
    <span id="unit-seen" class="muted"></span>
  </div>
</div>

<div class="panel banner" id="cost"></div>

<div class="panel" id="state"><span class="muted">idle</span></div>

<div class="panel">
  <div class="controls">
    <h2>Status</h2>
    <span class="grow"></span>
    <label for="live">live</label>
    <input type="checkbox" id="live">
    <button id="read">read</button>
  </div>
  <div id="status-panes">
    <pre id="screen" class="muted">nothing read yet</pre>
    <div id="sky-pane">
      <canvas id="sky" width="320" height="320"></canvas>
    </div>
  </div>
</div>

<footer id="colophon"></footer>

<script src="/common.js"></script>
<script src="/sky.js"></script>
<script>
// Everything interpolated into innerHTML goes through this: the values
// come from a string scraper over a serial line.

// How often a live status view re-reads, in milliseconds.
//
// Each read costs the receiver about 1.5 s of its serial link -- four
// fast polls -- so this is deliberately slower than the fast and medium
// tiers, and off unless someone turns it on.
const LIVE_PERIOD = 15000;

// The last screen drawn, so a resized window can redraw the plot at its
// new size without costing the receiver another read.
let shown = null;

// -------------------------------------------------------------- screen

// The screen as the receiver sent it.  textContent, not innerHTML, so
// nothing in it is ever read as markup.
function screen(s) {
  const pre = $("screen");
  pre.textContent = s?.text || "no status screen";
  pre.classList.toggle("muted", !s?.text);
}

// The plot grows to the screen's height and no further, so the two
// columns end together at any font size.  Beside the screen it shrinks
// to what is left of the row; stacked under it on a narrow window it
// takes the width, up to the same size.
function fit() {
  $("sky-pane").style.maxWidth = `${$("screen").offsetHeight}px`;
  drawSky($("sky"), shown);
}

// ---------------------------------------------------------------- read

// How long a screen read may take: 1.5 s of link, behind whatever the
// daemon was already doing.
const READ_TIMEOUT = 20000;

content({
  daemon: true,
  every: LIVE_PERIOD,
  auto: () => $("live").checked,
  // The sky is cleared, not left up: a canvas still showing eight
  // tracked satellites beside the words "no daemon" asserts a sky the
  // receiver may not have, which is the one stale value a GPS tool
  // must not show.
  clear(why, bad) {
    shown = null;
    $("screen").textContent = bad ? "no status screen" : why;
    $("screen").classList.add("muted");
    fit();
    $("state").innerHTML = pill(why, bad);
  },
  async load(signal) {
    $("read").disabled = true;
    $("state").innerHTML = pill("reading the status screen...");
    try {
      const s = await ask("/api/status" + liveQuery(), signal, READ_TIMEOUT);
      if (!s.screen) throw new Error("the daemon answered with no status screen");
      shown = s.screen;
      screen(s.screen);
      fit();
      $("state").innerHTML =
        `<span class="pill ok">read at ${esc(new Date().toLocaleTimeString())}</span>` +
        (s.screen.satellites_suspect
          ? ` <span class="pill stale">the table disagrees with its own counts</span>`
          : "");
    } finally {
      $("read").disabled = false;
    }
  },
});

// Said on the page because nothing else shows it: the log looks
// complete, with a hole wherever this page read.
$("cost").textContent =
  `Each read holds the receiver's link for about 1.5 s, leaving a gap in its ` +
  `once-a-second log; "live" reads every ${LIVE_PERIOD / 1000} s. ` +
  `The daemon also reads the screen itself every --sky seconds (300 by ` +
  `default). Leave this page for 1 Hz data with no other gaps.`;

$("read").onclick = () => renew(true);
window.addEventListener("resize", fit);
$("live").onchange = () => {
  if ($("live").checked) refresh();
};
</script>
