# Headless DOSBox-X for XACT's Phar Lap DOS-extended tools; run-xact.sh
# appends the [autoexec] section that mounts the trees and runs them.
[sdl]
output=surface
[dosbox]
machine=svga_s3
memsize=64
quit warning=false
[cpu]
core=dynamic
cputype=pentium
cycles=max
[render]
frameskip=10
[mixer]
nosound=true
[speaker]
pcspeaker=false
[sblaster]
sbtype=none
[dos]
xms=true
ems=true
umb=true
[log]
logfile=
